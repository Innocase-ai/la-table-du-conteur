<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terres — se promener dans la région</title>
    <style>
      :root { color-scheme: dark; --fond: #14110d; --carte: #1f1a14; --bord: #3a3025; --texte: #efe6d0; --doux: #a89c82; --or: #e8a317; --danger: #d9694f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fond); color: var(--texte); font: 14px/1.45 system-ui, sans-serif; }
      main { display: flex; gap: 16px; padding: 16px; max-width: 1020px; margin: 0 auto; flex-wrap: wrap; }
      h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
      #zone { flex: 1 1 680px; min-width: 0; }
      #cote { flex: 0 0 280px; display: flex; flex-direction: column; gap: 10px; }
      canvas { display: block; border-radius: 8px; border: 1px solid var(--bord); background: #000; }
      #vue { width: 100%; max-width: 680px; height: auto; outline: none; cursor: crosshair; }
      .boite { background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 10px 12px; }
      .horloge { font-size: 16px; font-weight: 600; }
      .doux { color: var(--doux); font-size: 13px; }
      .ligne { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
      button, select, input { background: #2b2319; color: var(--texte); border: 1px solid var(--bord); border-radius: 6px; padding: 5px 9px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--or); }
      button.principal { background: var(--or); color: #2a1a05; border-color: var(--or); font-weight: 600; }
      input[type='number'] { width: 90px; }
      #journal { max-height: 200px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
      #journal div { padding-left: 8px; border-left: 2px solid var(--bord); }
      #journal .repere { border-color: #7fb0d8; } #journal .rencontre { border-color: var(--danger); } #journal .poi { border-color: var(--or); }
      #journal .moment { border-color: #8a7ac4; font-style: italic; } #journal .ancre { border-color: #8fc46a; }
      #modale { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 16px; }
      #modale.ouverte { display: flex; }
      #modale .contenu { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 16px 18px; width: min(520px, 100%); }
      #modale h2 { margin: 0 0 6px; font-size: 17px; }
      #modale canvas { margin: 8px 0; max-width: 100%; }
      .aide { color: var(--doux); font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main>
      <section id="zone">
        <h1>Carrefour d’Aldric — se promener dans la région</h1>
        <canvas id="vue" width="680" height="440" tabindex="0"></canvas>
        <p class="aide">Flèches ou ZQSD pour avancer d’une case · clic sur une case pour y aller (Échap interrompt) · le brouillard se lève autour du groupe, les repères se voient de loin.</p>
        <div id="journal" class="boite" aria-live="polite"></div>
      </section>
      <aside id="cote">
        <div class="boite">
          <div class="horloge" id="horloge"></div>
          <div class="doux" id="situation"></div>
          <div class="ligne">
            <button id="camper1">Camper 1 h</button>
            <button id="camper8">Dormir 8 h</button>
          </div>
          <div class="ligne"><button id="entrer" class="principal" style="display:none"></button></div>
        </div>
        <div class="boite"><canvas id="mini" width="240" height="160" style="width:100%;height:auto"></canvas><div class="doux" id="explore"></div></div>
        <div class="boite">
          <div class="ligne" style="margin-top:0"><label>Groupe <select id="taille"><option value="4">4 héros</option><option value="6">6 héros</option></select></label><label>Niveau <select id="niveau"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>7</option></select></label></div>
          <div class="ligne"><label><input type="checkbox" id="fog" checked /> Brouillard</label><label><input type="checkbox" id="connus" checked /> Lieux connus d’avance</label></div>
          <div class="ligne"><label>Graine <input id="graine" type="number" /></label><button id="nouvelle">Autre</button><button id="chercher" title="Cherche une graine dont les routes respectent les durées écrites">Fidèle</button></div>
          <div class="ligne"><button id="sauver">Sauver</button><button id="charger">Charger</button></div>
          <div class="doux" id="rapport" style="margin-top:8px"></div>
        </div>
      </aside>
    </main>
    <div id="modale"><div class="contenu" id="contenu"></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
